<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signature Studio</title>
<meta name="description" content="Email signature generator for Outlook, Gmail and mobile clients.">
<!-- Interni alat, ne dio javnog sajta: stoji na portmix.ch samo zato što
     generisani potpis mora slike povlačiti sa stalne adrese. Bez ovoga bi
     ga pretraživači indeksirali kao stranicu klijentovog sajta. -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --accent:#C92A2F;
    --ink:#1c1a17; --ink-2:#4b453e; --ink-3:#7d746a; --ink-4:#a99f93;
    --paper:#f4f0e9; --panel:#fffdfa; --panel-2:#f9f5ee;
    --rule:#e4dbcd; --rule-2:#efe8dd;
    --ok:#3f7d4e; --warn:#a5641c; --bad:#b3322f;
    --r-lg:20px;
    --shadow:0 1px 2px rgba(40,30,20,.04), 0 14px 34px rgba(60,44,26,.07);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    font-size:14px;line-height:1.55;
    background:linear-gradient(180deg,#faf7f2 0%,var(--paper) 40%,#f2ece2 100%);
    background-attachment:fixed;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .shell{max-width:1460px;margin:0 auto;padding:22px 22px 40px}

  .masthead{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-lg);
    box-shadow:var(--shadow);overflow:hidden;position:sticky;top:14px;z-index:30}
  .masthead-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px}
  .wordmark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
  .wordmark b{font-size:15px;font-weight:650;letter-spacing:-.015em}
  .wordmark span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4)}

  .brandswitch{display:flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--panel-2)}
  .brandswitch button{display:flex;align-items:center;gap:8px;border:0;background:transparent;
    border-radius:999px;padding:6px 14px 6px 8px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:.16s}
  .brandswitch button .chip{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-weight:800;color:#fff;letter-spacing:-.04em;flex:0 0 auto}
  .brandswitch button[data-brand="portmix"] .chip{background:#C92A2F}
  .brandswitch button[data-brand="helvetique"] .chip{background:#1c1a17}
  .brandswitch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,44,26,.14)}

  .actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .lang{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-4)}

  .btn{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:8px 13px;
    font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.15s}
  .btn:hover{border-color:var(--ink-4);color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.12);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
  .btn.ghost:hover{background:var(--panel-2);color:var(--ink)}

  input[type=text],input:not([type]),select{width:100%;border:1px solid var(--rule);background:#fff;
    border-radius:10px;padding:9px 11px;font-size:13px;transition:.15s}
  select{width:auto;padding:6px 9px;font-size:12px;border-radius:8px}
  input:hover{border-color:var(--ink-4)}
  input:focus,select:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
  input::placeholder{color:var(--ink-4)}

  .layout{display:grid;grid-template-columns:minmax(0,388px) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
  @media(max-width:1060px){.layout{grid-template-columns:1fr}}

  .panel{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-lg);
    box-shadow:var(--shadow);overflow:hidden}
  .panel-head{padding:16px 18px 13px;border-bottom:1px solid var(--rule-2);background:var(--panel-2)}
  .panel-head h2{margin:3px 0 0;font-size:15.5px;font-weight:650;letter-spacing:-.012em}
  .eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  .panel-body{padding:14px 18px 18px}

  .group{margin-top:22px}
  .group:first-child{margin-top:2px}
  .group-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .group-title:after{content:"";flex:1;height:1px;background:var(--rule-2)}

  .field{margin-bottom:10px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .field label small{font-weight:400;color:var(--ink-4)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .color-row{display:flex;gap:8px;align-items:center}
  .color-row input[type=color]{width:40px;height:37px;padding:2px;border:1px solid var(--rule);
    border-radius:9px;background:#fff;cursor:pointer;flex:0 0 auto}

  .seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--rule-2);border-radius:11px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 5px;
    font-size:11.5px;font-weight:600;color:var(--ink-3);transition:.15s;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,44,26,.13)}

  .toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;
    border-bottom:1px solid var(--rule-2)}
  .toggle:last-child{border-bottom:0;padding-bottom:0}
  .toggle strong{display:block;font-size:12.5px;font-weight:600}
  .toggle span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
  .switch{position:relative;width:42px;height:24px;flex:0 0 auto}
  .switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .slider{position:absolute;inset:0;background:#ddd3c5;border-radius:999px;transition:.18s;pointer-events:none}
  .slider:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;
    border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .switch input:checked+.slider{background:var(--accent)}
  .switch input:checked+.slider:after{transform:translateX(18px)}
  .switch input:focus-visible+.slider{outline:2px solid var(--accent);outline-offset:2px}

  .stage-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    padding:13px 18px;border-bottom:1px solid var(--rule-2);background:var(--panel-2)}
  .stage-note{font-size:11px;color:var(--ink-3);margin-top:2px}
  .stage{background:repeating-linear-gradient(45deg,#ece4d8,#ece4d8 10px,#e9e0d2 10px,#e9e0d2 20px);
    display:grid;place-items:start center;padding:24px;overflow:auto;min-height:400px}
  .mail{background:#fff;border-radius:12px;border:1px solid #e0d5c6;box-shadow:0 16px 40px rgba(60,44,26,.14);
    overflow:hidden;width:100%;transition:max-width .22s ease}
  .mail-chrome{height:36px;border-bottom:1px solid #f1e8dc;display:flex;align-items:center;gap:6px;
    padding:0 12px;background:#fdfaf6}
  .dot{width:7px;height:7px;border-radius:50%;background:#dcd0c0}
  .mail-body{padding:20px;color:#43403a;font:14px/1.55 Arial,sans-serif;background:#fff;min-height:260px}
  .msg{margin-bottom:22px;color:#736a60}
  .sig-stage{overflow-x:auto}

  .meter{display:flex;align-items:center;gap:11px;padding:11px 18px;border-top:1px solid var(--rule-2);
    background:var(--panel);font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
  .meter .bar{flex:1;min-width:110px;height:5px;border-radius:999px;background:#e8dfd2;overflow:hidden}
  .meter .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
  .meter .status{font-weight:650;color:var(--ok)}
  .meter.warn .bar i{background:var(--warn)} .meter.warn .status{color:var(--warn)}
  .meter.bad .bar i{background:var(--bad)}  .meter.bad .status{color:var(--bad)}

  .code{margin-top:16px;border:1px solid #2a2622;border-radius:var(--r-lg);background:#221f1c;
    color:#efe6da;overflow:hidden;display:none}
  .code.open{display:block}
  .code-head{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;
    border-bottom:1px solid rgba(255,255,255,.08);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#c8bcab}
  .code-head .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#efe6da;
    letter-spacing:0;text-transform:none}
  .code-head .btn:hover{color:#fff;border-color:rgba(255,255,255,.32)}
  .code pre{margin:0;padding:15px;font:11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}

  .note{border:1px solid var(--rule);background:var(--panel-2);color:var(--ink-2);border-radius:12px;
    padding:11px 13px;font-size:11px;line-height:1.65;margin-top:12px}
  .note strong{color:var(--ink)}
  .note.alert{border-color:#e8c5bf;background:#fdf2f0;color:#8a3d38}
  .note.alert strong{color:#7a332e}

  .install{margin-top:20px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media(max-width:880px){.grid3{grid-template-columns:1fr}}
  .guide{border:1px solid var(--rule-2);background:#fff;border-radius:14px;padding:15px;position:relative}
  .guide:before{content:"";position:absolute;left:15px;width:26px;top:0;height:2px;background:var(--accent)}
  .guide .tag{display:inline-block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700}
  .guide h3{margin:6px 0 8px;font-size:13.5px;font-weight:650}
  .guide ol,.guide p{font-size:11.5px;line-height:1.7;color:var(--ink-3)}
  .guide ol{padding-left:16px;margin:0}
  .guide a{color:var(--accent);font-size:11.5px;font-weight:600;text-decoration:none}
  .guide a:hover{text-decoration:underline}
  .source{margin-top:13px;font-size:11px;line-height:1.7;color:var(--ink-4)}
  .foot{text-align:center;font-size:10.5px;letter-spacing:.05em;color:var(--ink-4);padding:26px 0 4px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);background:var(--ink);
    color:#f8f3ec;padding:11px 18px;border-radius:11px;font-size:12.5px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.22s;z-index:80;
    max-width:min(520px,90vw);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div class="masthead-top">
      <div class="wordmark"><b>Signature Studio</b><span id="brandSubtitle"></span></div>
      <div class="brandswitch" id="brandSwitch" role="group">
        <button type="button" data-brand="portmix" class="active"><span class="chip">P</span>PortMix SA</button>
        <button type="button" data-brand="helvetique"><span class="chip">H</span>Helvetique</button>
      </div>
      <div class="actions">
        <div class="lang">
          <label for="languageSelect" id="languageLabel">Jezik</label>
          <select id="languageSelect">
            <option value="bs">BS</option><option value="en">EN</option>
            <option value="de">DE</option><option value="fr">FR</option>
          </select>
        </div>
        <button class="btn ghost" id="resetBtn" type="button"></button>
        <button class="btn" id="mobileTextBtn" type="button"></button>
        <button class="btn" id="htmlBtn" type="button"></button>
        <button class="btn" id="downloadBtn" type="button"></button>
        <button class="btn primary" id="copyBtn" type="button"></button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <div class="eyebrow" id="editorEyebrow"></div>
        <h2 id="signatureDetailsTitle"></h2>
      </div>
      <div class="panel-body">
        <div class="group">
          <div class="group-title" id="identityTitle"></div>
          <div class="field"><label for="fullName" id="fullNameLabel"></label><input id="fullName" value="Nasuf Biljibani" autocomplete="name"></div>
          <div class="field"><label for="title" id="jobTitleLabel"></label><input id="title" value="Founder &amp; Managing Director"></div>
          <div class="field"><label for="company" id="companyLabel"></label><input id="company" value="PortMix SA"></div>
        </div>

        <div class="group">
          <div class="group-title" id="contactTitle"></div>
          <div class="two">
            <div class="field"><label for="phone" id="phoneLabel"></label><input id="phone" value="+41 21 611 12 14" inputmode="tel" placeholder="+41 ..."></div>
            <div class="field"><label for="mobile" id="mobileLabel"></label><input id="mobile" value="" inputmode="tel" placeholder="+41 ..."></div>
          </div>
          <div class="field"><label for="email" id="emailLabel"></label><input id="email" value="info@portmix.ch" inputmode="email" placeholder="ime@firma.ch"></div>
          <div class="field"><label for="website" id="websiteLabel"></label><input id="website" value="www.portmix.ch" inputmode="url" placeholder="www.firma.ch"></div>
          <div class="field"><label for="address" id="addressLabel"></label><input id="address" value="Route des Toches 3, 1026 Echandens" placeholder="Ulica 1, 1200 Grad"></div>
          <div class="field"><label for="mapUrl" id="mapUrlLabel"></label><input id="mapUrl" placeholder="https://maps.google.com/..."></div>
        </div>

        <div class="group">
          <div class="group-title" id="formatTitle"></div>
          <div class="field"><label id="sizeLabel"></label>
            <div class="seg" id="sizeSeg">
              <button type="button" data-size="compact" class="active"></button>
              <button type="button" data-size="standard"></button>
              <button type="button" data-size="large"></button>
            </div>
          </div>
          <div class="field"><label id="layoutLabel"></label>
            <div class="seg" id="layoutSeg">
              <button type="button" data-layout="split" class="active"></button>
              <button type="button" data-layout="stacked"></button>
            </div>
          </div>
          <div class="field"><label id="iconModeLabel"></label>
            <div class="seg" id="iconSeg">
              <button type="button" data-icons="images" class="active"></button>
              <button type="button" data-icons="labels"></button>
              <button type="button" data-icons="none"></button>
            </div>
          </div>
        </div>

        <div class="group">
          <div class="group-title" id="brandTitle"></div>
          <div class="field"><label for="accent" id="accentLabel"></label>
            <div class="color-row">
              <input type="color" id="accentPicker" value="#ED1C24" aria-labelledby="accentLabel">
              <input id="accent" value="#ED1C24" maxlength="7" spellcheck="false">
            </div>
          </div>
          <div class="field"><label for="tagline" id="taglineLabel"></label><input id="tagline" value="SMART SOLUTIONS. STRONGER CONNECTIONS."></div>
          <div class="field"><label for="logoUrl" id="logoUrlLabel"></label><input id="logoUrl" placeholder="https://.../signature-logo.png"></div>
          <div class="note" id="logoNotice"></div>
        </div>

        <div class="group">
          <div class="group-title" id="optionsTitle"></div>
          <div class="toggle">
            <div><strong id="showCompanyTitle"></strong><span id="showCompanyDesc"></span></div>
            <label class="switch"><input id="showCompany" type="checkbox" checked><span class="slider"></span></label>
          </div>
          <div class="toggle">
            <div><strong id="showLocationTitle"></strong><span id="showLocationDesc"></span></div>
            <label class="switch"><input id="showLocation" type="checkbox" checked><span class="slider"></span></label>
          </div>
          <div class="toggle">
            <div><strong id="showTaglineTitle"></strong><span id="showTaglineDesc"></span></div>
            <label class="switch"><input id="showTagline" type="checkbox" checked><span class="slider"></span></label>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="panel">
        <div class="stage-head">
          <div>
            <div class="eyebrow" id="livePreviewLabel"></div>
            <div class="stage-note" id="modeStatus"></div>
          </div>
          <div class="seg" id="previewSeg" style="min-width:250px">
            <button type="button" data-preview="640" class="active">Gmail 640</button>
            <button type="button" data-preview="760">Outlook 760</button>
            <button type="button" data-preview="380">Mobile 380</button>
          </div>
        </div>
        <div class="stage">
          <div class="mail" id="mailWindow" style="max-width:640px">
            <div class="mail-chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="mail-body">
              <div class="msg" id="messageCopy"></div>
              <div class="sig-stage" id="signaturePreview"></div>
            </div>
          </div>
        </div>
        <div class="meter" id="sizeMeter">
          <span id="sizeMeterLabel"></span>
          <span class="bar"><i id="sizeBar"></i></span>
          <span class="status" id="sizeStatus"></span>
        </div>
      </div>

      <div class="code" id="codePanel">
        <div class="code-head">
          <span id="generatedHtmlLabel"></span>
          <button class="btn" type="button" id="copyCodeBtn"></button>
        </div>
        <pre id="htmlOutput"></pre>
      </div>
    </section>
  </main>

  <section class="panel install" id="install">
    <div class="panel-head">
      <div class="eyebrow" id="installationEyebrow"></div>
      <h2 id="installationTitle"></h2>
      <div class="stage-note" id="guidanceNote"></div>
    </div>
    <div class="panel-body">
      <div class="grid3" id="installGrid"></div>
      <div class="note" id="deploymentNotice"></div>
      <div class="note" id="bestPracticeNotice"></div>
      <div class="source" id="sourceNote"></div>
    </div>
  </section>

  <footer class="foot" id="footerText"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

ox. Check logo loading, links, spacing and reply behaviour. Some recipients or corporate policies block automatic external image downloads; that is a mail-client security setting, not a broken signature.", "source": "The signature uses presentation tables, inline CSS, web-safe fonts, fixed column widths, mso-line-height-rule for Outlook and link-safe inline styling. Empty fields are dropped from the layout automatically. JavaScript is used only by the generator, never inside the signature.", "footer": "Signature Studio · Standalone HTML generator · All editing and generation happens locally in the browser.", "logoHosted": "<strong>Hosted logo:</strong> the signature uses your public HTTPS URL — best for Gmail and Outlook.", "logoPackage": "<strong>Package logo:</strong> the generator uses <b>portmix-signature-logo.png</b> from this same folder. This is the easiest setup to maintain.", "logoOffline": "<strong>Offline logo:</strong> the logo is embedded as base64 so the generator works locally. This inflates the code size — for production, upload the PNG files to an HTTPS folder or paste a hosted logo URL above.", "toastSignature": "Signature copied — paste it into your email client.", "toastBlocked": "Browser blocked automatic copy. Use “View HTML” or select the preview manually.", "toastMobile": "Mobile text signature copied.", "toastCode": "HTML source copied.", "toastDownloaded": "Signature HTML downloaded.", "toastReset": "Defaults restored.", "emailSignatureTitle": "Email Signature", "defaultTitle": "Founder & Managing Director", "defaultTagline": "SMART SOLUTIONS. STRONGER CONNECTIONS.", "guides": [{"tag": "Gmail · Web", "title": "Full visual signature", "html": "<ol><li>Click <b>Copy signature</b> above.</li><li>In Gmail open <b>Settings → See all settings</b>.</li><li>Under <b>General → Signature</b>, create a new signature.</li><li>Click inside the signature editor and paste.</li><li>Choose defaults for new emails and replies/forwards.</li><li>Scroll down an const setText = (id,v) => { const e=$(id); if(e) e.textContent=v; };
const setHtml = (id,v) => { const e=$(id); if(e) e.innerHTML=v; };

function escapeHtml(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function normalizeWebUrl(v){
  const s=String(v||'').trim();
  return !s ? '' : (/^https?:\/\//i.test(s) ? s : 'https://'+s);
}
const normalizeTel = v => String(v||'').replace(/[^+0-9]/g,'');
function safeColor(v){
  let s=String(v||'').trim();
  if(/^[0-9a-f]{6}$/i.test(s)) s='#'+s;
  if(/^#[0-9a-f]{3}$/i.test(s)) s='#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
  return /^#[0-9a-f]{6}$/i.test(s) ? s.toUpperCase() : '#ED1C24';
}
const isHosted = () => location.protocol==='https:' || location.protocol==='http:';

function state(){
  const s={};
  fieldIds.forEach(id => s[id] = $(id).value.trim());
  toggleIds.forEach(id => s[id] = $(id).checked);
  s.accent = safeColor(s.accent);
  s.brand = BRANDS[brand];
  Object.assign(s, opts);
  return s;
}
const resolveAsset = (file, b64) => isHosted() ? new URL(file, location.href).href : 'data:image/png;base64,'+b64;
function resolveLogo(s){
  if(s.logoUrl) return normalizeWebUrl(s.logoUrl);
  return resolveAsset(s.brand.logoFile, ASSETS[s.brand.logoAsset]);
}
const ICON_FILES = {phone:'icon-phone.png', mail:'icon-mail.png', web:'icon-web.png', location:'icon-location.png'};
const iconSrc = kind => resolveAsset(ICON_FILES[kind], ASSETS[kind]);

function contactItems(s){

    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address);
  if(s.phone)   items.push({kind:'phone', label:'T', text:s.phone,   href:'tel:'+normalizeTel(s.phone)});
  if(s.mobile)  items.push({kind:'phone', label:'M', text:s.mobile,  href:'tel:'+normalizeTel(s.mobile)});
  if(s.email)   items.push({kind:'mail',  label:'E', text:s.email,   href:'mailto:'+s.email});
  if(s.website) items.push({kind:'web',   label:'W', text:s.website, href:normalizeWebUrl(s.website)});
  if(s.showLocation && s.address)
    items.push({kind:'location', label:'A', text:s.address, href:mapHref, wrap:true});
  return items;
}

function link(href, text, color, wrap){
  const nw = wrap ? '' : 'white-space:nowrap;';
  return `<a href="${escapeHtml(href)}" style="color:${color} !important;text-decoration:none !important;${nw}">`
       + `<span style="color:${color} !important;text-decoration:none !important;${nw}">${escapeHtml(text)}</span></a>`;
}

function contactCell(item, p, s){
  const t = s.brand.theme;
  const td = `font-family:${t.bodyFont};font-size:${p.body}px;line-height:${p.bodyLh}px;`
           + `mso-line-height-rule:exactly;color:${t.bodyColor};vertical-align:middle;`;
  const body = link(item.href, item.text, t.bodyColor, item.wrap);
  if(s.icons === 'images'){
    const iw = p.icon, cell = iw + 9;
    return `<table role="presentation" border="0" cellpadding="0" cellspacing="0"`
      + ` style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;"><tr>`
      + `<td width="${cell}" valign="middle" style="width:${cell}px;padding:0 9px 0 0;vertical-align:middle;">`
      + `<img src="${escapeHtml(iconSrc(item.kind))}" width="${iw}" height="${iw}" alt=""`
      + ` style="display:block;width:${iw}px;height:${iw}px;border:0;outline:none;text-decoration:none;"></td>`
      + `<td valign="middle" style="padding:0;${td}">${body}</td></tr></table>`;
  }
  if(s.icons === 'labels'){
    return `<div style="${td}"><span style="color:${s.accent};font-weight:700;letter-spacing:.5px;">`
      + `${item.label}</span>&nbsp;&nbsp;${body}</div>`;
  }
  return `<div style="${td}">${body}</div>`;
}

const estWidth = (text, fs) => String(text).length * fs * 0.55;

function contactBlock(s, p, width, maxCols){
  const items = contactItems(s);
  if(!items.length) return '';
  const iconW = s.icons === 'images' ? p.icon + 9 : (s.icons === 'labels' ? p.body * 1.6 : 0);
  const halfCol = Math.floor((width - 33) / 2);
  const fits = items.filter(it => !it.wrap).every(it => estWidth(it.text, p.body) + iconW <= halfCol);
  const cols = (maxCols === 2 && fits && items.length > 1) ? 2 : 1;
  const rule = s.brand.theme.rule;
  const rows=[];
  if(cols === 1){
    items.forEach((it,i) =>
      rows.push(`<tr><td style="padding:${i?p.gap:0}px 0 0 0;">${contactCell(it,p,s)}</td></tr>`));
  }else{
    const gutter = 16;
    const colA = Math.floor((width - gutter - 1 - gutter) / 2);
    const colB = width - gutter - 1 - gutter - colA;
    for(let i=0;i<items.length;i+=2){
      const a=items[i], b=items[i+1];
      const pad = i ? `padding:${p.gap}px 0 0 0;` : 'padding:0;';
      if(b){
        rows.push(`<tr>`
          + `<td width="${colA}" valign="middle" style="width:${colA}px;${pad}vertical-align:middle;">${contactCell(a,p,s)}</td>`
          + `<td width="${gutter}" style="width:${gutter}px;${pad}font-size:0;line-height:0;">&nbsp;</td>`
          + `<td width="1" bgcolor="${rule}" style="width:1px;background-color:${rule};${pad}font-size:0;line-height:0;">&nbsp;</td>`
          + `<td width="${gutter}" style="width:${gutter}px;${pad}font-size:0;line-height:0;">&nbsp;</td>`
          + `<td width="${colB}" valign="middle" style="width:${colB}px;${pad}vertical-align:middle;">${contactCell(b,p,s)}</td>`
          + `</tr>`);
      }else{
        rows.push(`<tr><td colspan="5" valign="middle" style="${pad}vertical-align:middle;">${contactCell(a,p,s)}</td></tr>`);
      }
    }
  }
  return `<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="${width}"`
    + ` style="width:${width}px;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">${rows.join('')}</table>`;
}

function identityBlock(s, p){
  const t = s.brand.theme;
  const base = `mso-line-height-rule:exactly;`;
  const titleSize = Math.round(p.title * (t.titleScale || 1));
  let out = `<tr><td style="padding:0;font-family:${t.nameFont};${base}font-size:${p.name}px;`
    + `line-height:${p.nameLh}px;font-weight:${t.nameWeight};letter-spacing:${t.nameLs}px;`
    + `color:${t.nameColor};">${escapeHtml(s.fullName)}</td></tr>`;
  if(s.title)
    out += `<tr><td style="padding:6px 0 0 0;font-family:${t.bodyFont};${base}font-size:${titleSize}px;`
      + `line-height:${p.titleLh}px;font-weight:${t.titleWeight};letter-spacing:${t.titleLs}px;`
      + `text-transform:${t.titleCase};color:${t.titleColor};">${escapeHtml(s.title)}</td></tr>`;
  if(s.showCompany && s.company){
    const col = t.compColor === 'accent' ? s.accent : t.compColor;
    out += `<tr><td style="padding:4px 0 0 0;font-family:${t.bodyFont};${base}font-size:${p.comp}px;`
      + `line-height:${p.compLh}px;font-weight:${t.compWeight};letter-spacing:${t.compLs}px;`
      + `text-transform:${t.compCase};color:${col};">${escapeHtml(s.company)}</td></tr>`;
  }
  return out;
}

function taglineBlock(s, p, width, colspan){
  if(!(s.showTagline && s.tagline)) return '';
  const t = s.brand.theme;
  const ls = (p.tagLs * t.tagLs).toFixed(1);
  const inner = t.tagBar === 'left'
    ? `<span style="display:inline-block;border-left:3px solid ${s.accent};padding-left:10px;color:${t.tagColor};">${escapeHtml(s.tagline)}</span>`
    : `<span style="color:${t.tagColor};">${escapeHtml(s.tagline)}</span>`;
  const topRule = t.tagBar === 'left'
    ? `<tr><td style="border-top:1px solid ${t.rule};font-size:0;line-height:0;">&nbsp;</td></tr>`
    : `<tr><td width="46" style="width:46px;border-top:2px solid ${s.accent};font-size:0;line-height:0;">&nbsp;</td></tr>`;
  return `<tr><td colspan="${colspan}" style="padding:${p.block}px 0 0 0;">`
    + `<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="${width}"`
    + ` style="width:${width}px;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">`
    + topRule
    + `<tr><td style="padding:${Math.round(p.block*0.7)}px 0 0 0;font-family:${t.bodyFont};`
    + `font-size:${p.tag}px;line-height:${Math.round(p.tag*1.6)}px;mso-line-height-rule:exactly;`
    + `letter-spacing:${ls}px;text-transform:uppercase;">${inner}</td></tr></table></td></tr>`;
}

function buildSignature(s){
  const p = PRESETS[s.size] || PRESETS.compact;
  const t = s.brand.theme;
  const W = p.w;
  const logoW = Math.round(p.logo * s.brand.logoScale);
  const logoSrc = escapeHtml(resolveLogo(s));
  const webHref = escapeHtml(normalizeWebUrl(s.website) || '#');
  const outer = `role="presentation" border="0" cellpadding="0" cellspacing="0"`;
  const ts = `border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;`;

  const logoImg = `<a href="${webHref}" style="text-decoration:none;">`
    + `<img src="${logoSrc}" width="${logoW}" alt="${escapeHtml(s.company || 'Logo')}"`
    + ` style="display:block;width:${logoW}px;max-width:${logoW}px;height:auto;border:0;outline:none;text-decoration:none;"></a>`;

  if(s.layout === 'stacked'){
    return `<table ${outer} width="${W}" style="width:${W}px;${ts}background:#ffffff;">`
      + `<tr><td style="padding:0 0 ${p.block}px 0;">${logoImg}</td></tr>`
      + `<tr><td><table ${outer} width="${W}" style="width:${W}px;${ts}">${identityBlock(s,p)}</table></td></tr>`
      + `<tr><td height="${p.block}" style="height:${p.block}px;font-size:0;line-height:${p.block}px;">&nbsp;</td></tr>`
      + `<tr><td>${contactBlock(s, p, W, 2)}</td></tr>`
      + taglineBlock(s, p, W, 1)
      + `</table>`;
  }

  const logoCol = Math.max(logoW, Math.round(W * 0.33));
  const gut = p.pad;
  const rightCol = W - logoCol - gut - 1 - gut;

  return `<table ${outer} width="${W}" style="width:${W}px;${ts}background:#ffffff;">`
    + `<tr>`
    + `<td width="${logoCol}" valign="middle" style="width:${logoCol}px;padding:0 ${gut}px 0 0;vertical-align:middle;">${logoImg}</td>`
    + `<td width="1" bgcolor="${t.rule}" style="width:1px;background-color:${t.rule};font-size:0;line-height:0;">&nbsp;</td>`
    + `<td width="${rightCol}" valign="top" style="width:${rightCol}px;padding:0 0 0 ${gut}px;vertical-align:top;">`
    + `<table ${outer} width="${rightCol}" style="width:${rightCol}px;${ts}">`
    + identityBlock(s,p)
    + `<tr><td height="${p.block}" style="height:${p.block}px;font-size:0;line-height:${p.block}px;">&nbsp;</td></tr>`
    + `<tr><td>${contactBlock(s, p, rightCol, 2)}</td></tr>`
    + `</table></td></tr>`
    + taglineBlock(s, p, W, 3)
    + `</table>`;
}

function mobileText(s){
  const l=[s.fullName];
  if(s.title) l.push(s.title);
  if(s.showCompany && s.company) l.push(s.company);
  l.push('');
  if(s.phone)   l.push('T: '+s.phone);
  if(s.mobile)  l.push('M: '+s.mobile);
  if(s.email)   l.push('E: '+s.email);
  if(s.website) l.push('W: '+s.website);
  if(s.showLocation && s.address) l.push('A: '+s.address);
  if(s.showTagline && s.tagline) l.push('', s.tagline);
  return l.join('\n');
}

const GMAIL_LIMIT = 10000;

function render(){
  const s = state();
  const html = buildSignature(s);
  $('signaturePreview').innerHTML = html;
  $('htmlOutput').textContent = html;

  const len = html.length;
  $('sizeBar').style.width = Math.min(100, Math.round(len/GMAIL_LIMIT*100)) + '%';
  setText('sizeMeterLabel', tr('sizeMeter').replace('{n}', len.toLocaleString(currentLang==='bs'?'bs-BA':currentLang)));
  const meter = $('sizeMeter');
  meter.classList.remove('warn','bad');
  if(len > GMAIL_LIMIT){ meter.classList.add('bad'); setText('sizeStatus', tr('sizeOver')); }
  else if(len > GMAIL_LIMIT*0.8){ meter.classList.add('warn'); setText('sizeStatus', tr('sizeNear')); }
  else setText('sizeStatus', tr('sizeOk'));

  const packageHosted = !s.logoUrl && isHosted();
  const notice = $('logoNotice');
  notice.className = 'note' + (!s.logoUrl && !packageHosted && len > GMAIL_LIMIT ? ' alert' : '');
  notice.innerHTML = s.logoUrl ? tr('logoHosted') : packageHosted ? tr('logoPackage') : tr('logoOffline');
}

function renderGuides(){
  $('installGrid').innerHTML = (tr('guides')||[]).map(g => `
    <article class="guide">
      <span class="tag">${g.tag}</span><h3>${g.title}</h3>${g.html}
      ${g.url ? `<p><a href="${g.url}" target="_blank" rel="noopener">${g.link}</a></p>` : ''}
    </article>`).join('');
}

function setSeg(segId, attr, value){
  [...$(segId).children].forEach(b => b.classList.toggle('active', b.dataset[attr] === value));
}

function applyBrand(next, {migrate=true} = {}){
  const from = BRANDS[brand], to = BRANDS[next];
  if(migrate && from !== to){
    brandFieldIds.forEach(id => {
      const el = $(id);
      if(el.value.trim() === String(from.fields[id] ?? '')) el.value = to.fields[id] ?? '';
    });
    if(to.key === 'helvetique' && trDefaultTaglines.includes($('tagline').value.trim())) $('tagline').value = '';
    $('showTagline').checked = to.showTagline;
    opts.icons = to.icons;
    setSeg('iconSeg','icons',opts.icons);
  }
  brand = next;
  document.documentElement.style.setProperty('--accent', to.ui);
  $('accentPicker').value = safeColor($('accent').value);
  [...$('brandSwitch').children].forEach(b => b.classList.toggle('active', b.dataset.brand === next));
  render();
}

function applyLanguage(lang, {updateDefaults=true}={}){
  currentLang = I18N[lang] ? lang : 'bs';
  try{ localStorage.setItem('signatureStudioLanguage', currentLang); }catch(e){}
  document.documentElement.lang = currentLang;
  document.title = tr('docTitle');
  $('languageSelect').value = currentLang;

  const map = {
    brandSubtitle:'studioTag', languageLabel:'language', resetBtn:'reset',
    mobileTextBtn:'copyMobile', copyBtn:'copySignature', downloadBtn:'downloadHtml',
    editorEyebrow:'editor', signatureDetailsTitle:'signatureDetails', identityTitle:'identity',
    fullNameLabel:'fullName', jobTitleLabel:'jobTitle', companyLabel:'company',
    contactTitle:'contact', phoneLabel:'phone', mobileLabel:'mobilePhone', emailLabel:'email',
    websiteLabel:'website', addressLabel:'address', formatTitle:'format', sizeLabel:'size',
    layoutLabel:'layout', iconModeLabel:'iconMode', brandTitle:'brand', accentLabel:'accent',
    taglineLabel:'tagline', optionsTitle:'options', showCompanyTitle:'showCompany',
    showCompanyDesc:'showCompanyDesc', showLocationTitle:'showLocation',
    showLocationDesc:'showLocationDesc', showTaglineTitle:'showTagline',
    showTaglineDesc:'showTaglineDesc', livePreviewLabel:'livePreview',
    generatedHtmlLabel:'generatedHtml', copyCodeBtn:'copyCode',
    installationEyebrow:'installation', installationTitle:'installationTitle',
    guidanceNote:'guidance', sourceNote:'source', footerText:'footer'
  };
  Object.entries(map).forEach(([id,key]) => setText(id, tr(key)));
  setHtml('mapUrlLabel', tr('mapLink'));
  setHtml('logoUrlLabel', tr('logoUrl'));
  setHtml('messageCopy', tr('message'));
  setHtml('deploymentNotice', tr('deployment'));
  setHtml('bestPracticeNotice', tr('bestPractice'));

  [['sizeSeg',['sizeCompact','sizeStandard','sizeLarge']],
   ['layoutSeg',['layoutSplit','layoutStacked']],
   ['iconSeg',['iconImages','iconLabels','iconNone']]]
   .forEach(([id,keys]) => keys.forEach((k,i) => $(id).children[i].textContent = tr(k)));

  setText('htmlBtn', $('codePanel').classList.contains('open') ? tr('hideHtml') : tr('viewHtml'));
  setText('modeStatus', tr('previewNote'));

  if(updateDefaults && brand === 'portmix'){
    if(trDefaultTitles.includes($('title').value.trim()))     $('title').value = tr('defaultTitle');
    if(trDefaultTaglines.includes($('tagline').value.trim())) $('tagline').value = tr('defaultTagline');
  }
  renderGuides();
  render();
}

function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(window.__t); window.__t=setTimeout(()=>el.classList.remove('show'),2800);
}

async function copySignature(){
  const s = state(), html = buildSignature(s), plain = mobileText(s);
  try{
    const box = document.createElement('div');
    box.setAttribute('contenteditable','true');
    box.style.cssText='position:fixed;left:-10000px;top:0;background:#fff;color:#252525;font-family:Arial,Helvetica,sans-serif;';
    box.innerHTML = html;
    document.body.appendChild(box);
    const range = document.createRange();
    range.selectNodeContents(box);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges(); box.remove();
    if(ok){ toast(tr('toastSignature')); return; }
  }catch(e){}
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html],{type:'text/html'}),
        'text/plain': new Blob([plain],{type:'text/plain'})
      })]);
      toast(tr('toastSignature')); return;
    }
    throw new Error('unsupported');
  }catch(e){ toast(tr('toastBlocked')); }
}

async function copyText(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(msg); }catch(_){ toast(tr('toastBlocked')); }
    ta.remove();
  }
}

function downloadSignature(){
  const s = state();
  const doc = `<!doctype html><html lang="${currentLang}"><head><meta charset="utf-8">`
    + `<title>${escapeHtml(s.fullName)} — ${escapeHtml(tr('emailSignatureTitle'))}</title></head>`
    + `<body style="margin:32px;background:#ffffff;">${buildSignature(s)}</body></html>`;
  const url = URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = (s.fullName||'signature').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')
    + '-' + brand + '-signature.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(tr('toastDownloaded'));
}

fieldIds.forEach(id => $(id).addEventListener('input', render));
toggleIds.forEach(id => $(id).addEventListener('change', render));

$('accentPicker').addEventListener('input', e => { $('accent').value = e.target.value.toUpperCase(); render(); });
$('accent').addEventListener('input', () => { $('accentPicker').value = safeColor($('accent').value); render(); });

function segment(segId, key, attr){
  $(segId).addEventListener('click', e => {
    const btn = e.target.closest('button[data-'+attr+']');
    if(!btn) return;
    opts[key] = btn.dataset[attr];
    setSeg(segId, attr, opts[key]);
    render();
  });
}
segment('sizeSeg','size','size');
segment('layoutSeg','layout','layout');
segment('iconSeg','icons','icons');

$('brandSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-brand]');
  if(!btn || btn.dataset.brand === brand) return;
  applyBrand(btn.dataset.brand);
  toast(tr('toastBrand').replace('{n}', BRANDS[brand].fields.company));
});

$('previewSeg').addEventListener('click', e => {
  const btn = e.target.closest('button[data-preview]');
  if(!btn) return;
  setSeg('previewSeg','preview',btn.dataset.preview);
  $('mailWindow').style.maxWidth = btn.dataset.preview + 'px';
});

$('languageSelect').addEventListener('change', e => applyLanguage(e.target.value));
$('copyBtn').addEventListener('click', copySignature);
$('mobileTextBtn').addEventListener('click', () => copyText(mobileText(state()), tr('toastMobile')));
$('copyCodeBtn').addEventListener('click', () => copyText(buildSignature(state()), tr('toastCode')));
$('downloadBtn').addEventListener('click', downloadSignature);

$('htmlBtn').addEventListener('click', () => {
  const open = $('codePanel').classList.toggle('open');
  setText('htmlBtn', open ? tr('hideHtml') : tr('viewHtml'));
});

$('resetBtn').addEventListener('click', () => {
  const b = BRANDS[brand];
  brandFieldIds.forEach(id => $(id).value = b.fields[id] ?? '');
  if(brand === 'portmix'){
    $('fullName').value = 'Nasuf Biljibani';
    $('title').value = tr('defaultTitle');
    $('tagline').value = tr('defaultTagline');
  }
  $('showCompany').checked = true;
  $('showLocation').checked = true;
  $('showTagline').checked = b.showTagline;
  opts = {size:'compact', layout:'split', icons:b.icons};
  setSeg('sizeSeg','size',opts.size);
  setSeg('layoutSeg','layout',opts.layout);
  setSeg('iconSeg','icons',opts.icons);
  $('accentPicker').value = safeColor($('accent').value);
  render();
  toast(tr('toastReset'));
});

let saved=null;
try{ saved = localStorage.getItem('signatureStudioLanguage'); }catch(e){}
const bl = (navigator.language||'').toLowerCase();
applyBrand('portmix', {migrate:false});
applyLanguage(
  saved && I18N[saved] ? saved
  : bl.startsWith('de') ? 'de'
  : bl.startsWith('fr') ? 'fr'
  : bl.startsWith('en') ? 'en' : 'bs'
);
})();
</script>
